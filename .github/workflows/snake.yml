name: Generate contribution snake (2026 only)

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'
      - 'scripts/generate_2026_snake.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The standard Platane/snk action uses a rolling contribution window.
      # This generator queries GitHub GraphQL for the fixed 2026 calendar year.
      - name: Generate snake SVGs for 2026 only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          SNAKE_YEAR: '2026'
        run: python scripts/generate_2026_snake.py --out-dir dist

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
